<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Énergie - Configurateur Kit Solaire Autonome 12V / 230V</title>
    <style>
        :root {
            --primary-dark: #0f172a;
            --primary-blue: #1e293b;
            --accent-amber: #f59e0b;
            --accent-amber-hover: #d97706;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* --- EN-TÊTE PROFESSIONNEL (HERO) --- */
        .hero-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-blue) 100%);
            color: #ffffff;
            padding: 40px 20px 35px 20px;
            border-bottom: 4px solid var(--accent-amber);
        }

        .hero-container {
            max-width: 1180px;
            margin: 0 auto;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-weight: 700;
            font-size: 13px;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .hero-header h1 {
            margin: 0 0 10px 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            color: #cbd5e1;
            font-size: 17px;
            max-width: 780px;
            margin: 0 0 25px 0;
        }

        .trust-badges {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #e2e8f0;
        }

        .badge-icon {
            background: var(--accent-amber);
            color: var(--primary-dark);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* --- STRUCTURE PRINCIPALE EN 2 COLONNES --- */
        .main-wrapper {
            max-width: 1180px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.35fr 0.85fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 920px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }

        /* --- CARTES D'ÉTAPES --- */
        .step-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 26px;
            margin-bottom: 24px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            border: 1px solid var(--border-color);
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-light);
        }

        .step-number {
            background: var(--primary-dark);
            color: var(--accent-amber);
            font-weight: 800;
            font-size: 15px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .step-header h2 {
            margin: 0;
            font-size: 19px;
            color: var(--primary-dark);
        }

        /* --- CHAMPS DE FORMULAIRE --- */
        .field-group {
            margin-bottom: 18px;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .field-hint {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        select:hover, input:hover {
            border-color: #94a3b8;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-amber);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        /* --- COLONNE DROITE : RÉCAPITULATIF & PRIX (STICKY) --- */
        .summary-panel {
            background: var(--card-bg);
            border-radius: 10px;
            border: 2px solid var(--primary-blue);
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
            position: sticky;
            top: 20px;
            overflow: hidden;
        }

        .summary-header {
            background: var(--primary-dark);
            color: #ffffff;
            padding: 18px 22px;
            border-bottom: 3px solid var(--accent-amber);
        }

        .summary-header h3 {
            margin: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8
